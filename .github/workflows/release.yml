name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  quality:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      # `.npmrc` references `${NPM_TOKEN}`; when the variable is unset pnpm warns
      # ("Failed to replace env in config") on every install. Only the publish
      # step needs a real token.
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup PNPM
        uses: pnpm/action-setup@v4.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Install deps
        run: pnpm install

      - name: Lint check
        run: pnpm run lint

  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [quality]
    env:
      # Defined (even empty) so `pnpm install` does not warn about the
      # `${NPM_TOKEN}` placeholder in `.npmrc`; the publish step below overrides
      # it with the real token.
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup PNPM
        uses: pnpm/action-setup@v4.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Install deps
        run: pnpm install

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1.4.7
        # ⚠ TODO(RESTORE-REQUIRED)：VS Code 扩展（VS Code Marketplace）发布链路暂不可用，
        # 这里「临时」去掉 `vsce publish`，只保留 Open VSX（ovsx）发布 —— 后续必须加回来！
        #
        # `pnpm run release`（scripts/release.ts）会为 vscode-extension 触发
        # `ovsx publish`（Open VSX）与 `vsce publish`（VS Code Marketplace）。
        #
        # 【当前生效，已删除 vsce】packages/vscode-extension/package.json：
        #   "release:pre": "ovsx publish --no-dependencies --pre-release",
        #   "release": "ovsx publish --no-dependencies"
        #
        # 【TODO 恢复成下面这版，把 `&& vsce publish ...` 追加回去即可】：
        #   "release:pre": "ovsx publish --no-dependencies --pre-release && vsce publish --no-dependencies --pre-release",
        #   "release": "ovsx publish --no-dependencies && vsce publish --no-dependencies"
        with:
          version: pnpm run changeset:version
          publish: pnpm run release
          commit: 'ci: release'
          title: 'ci: release'
        env:
          GITHUB_TOKEN: ${{ secrets.ALOVA_GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_ALOVA_PUBLISH_TOKEN }}
          VSCE_PAT: ${{ secrets.VSCODE_EXTENSION_TOKEN }}
          OVSX_PAT: ${{ secrets.OVSX_TOKEN }}
